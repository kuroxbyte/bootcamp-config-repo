server:
  port: ${SERVER_PORT:8084}

spring:
  mongodb:
    # Una base de datos por microservicio.
    uri: ${MONGODB_URI:mongodb://localhost:27020/transaction_db}

# Los servicios consultados se resuelven por su nombre en Eureka.
clients:
  account-service:
    base-url: ${ACCOUNT_SERVICE_URL:http://account-service}
  credit-service:
    base-url: ${CREDIT_SERVICE_URL:http://credit-service}
