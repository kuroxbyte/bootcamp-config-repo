server:
  port: ${SERVER_PORT:8081}

spring:
  mongodb:
    # Una base de datos por microservicio.
    uri: ${MONGODB_URI:mongodb://localhost:27017/customer_db}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Espera la confirmación de todas las réplicas antes de dar el evento por publicado.
      acks: all
      properties:
        # Si el broker no responde, se deja de esperar en 1 s (el gateway corta a los 2 s).
        max.block.ms: 1000

# Tópicos de eventos (Kafka).
messaging:
  topics:
    customer-events: customer-events

# Al dar de baja un cliente se verifica que no tenga productos activos. Los servicios consultados
# se resuelven por su nombre en Eureka.
clients:
  account-service:
    base-url: ${ACCOUNT_SERVICE_URL:http://account-service}
  credit-service:
    base-url: ${CREDIT_SERVICE_URL:http://credit-service}
