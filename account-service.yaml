server:
  port: ${SERVER_PORT:8082}

spring:
  mongodb:
    # Una base de datos por microservicio.
    uri: ${MONGODB_URI:mongodb://localhost:27018/account_db}
  data:
    mongodb:
      # IndexMigration crea y actualiza los índices al arrancar; la creación automática de Spring
      # no puede modificar un índice existente y registraría un error.
      auto-index-creation: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        # Si el broker no responde, se deja de esperar en 1 s (el gateway corta a los 2 s).
        max.block.ms: 1000
    consumer:
      group-id: account-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Los servicios consultados se resuelven por su nombre en Eureka.
clients:
  customer-service:
    base-url: ${CUSTOMER_SERVICE_URL:http://customer-service}
  credit-service:
    base-url: ${CREDIT_SERVICE_URL:http://credit-service}
  # Para dar de baja una cuenta se consulta su saldo.
  transaction-service:
    base-url: ${TRANSACTION_SERVICE_URL:http://transaction-service}

# Monto mínimo de apertura por tipo de cuenta; puede ser 0.
accounts:
  minimum-opening-amount:
    savings: ${MIN_OPENING_SAVINGS:0}
    checking: ${MIN_OPENING_CHECKING:0}
    fixed-term: ${MIN_OPENING_FIXED_TERM:0}
  # Monto mínimo de promedio diario que exige cada mes la cuenta de ahorro VIP.
  vip-savings:
    minimum-daily-average: ${MIN_DAILY_AVERAGE_VIP:500}
  # Comisión por transacción: cada mes, los depósitos y retiros que superan
  # free-monthly-transactions pagan amount cada uno.
  transaction-fee:
    savings:
      free-monthly-transactions: ${FREE_TRANSACTIONS_SAVINGS:4}
      amount: ${TRANSACTION_FEE_SAVINGS:1.00}
    checking:
      free-monthly-transactions: ${FREE_TRANSACTIONS_CHECKING:3}
      amount: ${TRANSACTION_FEE_CHECKING:2.00}
    fixed-term:
      free-monthly-transactions: ${FREE_TRANSACTIONS_FIXED_TERM:1}
      amount: ${TRANSACTION_FEE_FIXED_TERM:5.00}

# Tópicos de eventos (Kafka): consume debt-events y publica debit-card-events.
messaging:
  topics:
    debt-events: debt-events
    debit-card-events: debit-card-events

# Caché en Redis de la copia local del estado de deuda de cada cliente.
cache:
  debt-status:
    ttl: ${CACHE_DEBT_STATUS_TTL:10m}
