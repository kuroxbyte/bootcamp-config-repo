server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          # Las URIs lb:// se resuelven con las instancias registradas en Eureka. Cada ruta tiene su
          # circuit breaker (timeout de 2 s en application.yaml); si falla, responde /fallback (503).
          routes:
            # Reportes del banco.
            - id: reports
              uri: lb://transaction-service
              order: 0
              predicates:
                - Path=/api/v1/reports/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: reports
                    fallbackUri: forward:/fallback
            # Transacciones anidadas bajo cada producto (más específicas, se evalúan primero).
            - id: account-transactions
              uri: lb://transaction-service
              order: 0
              predicates:
                - Path=/api/v1/accounts/*/deposits,/api/v1/accounts/*/withdrawals,/api/v1/accounts/*/balance,/api/v1/accounts/*/daily-average,/api/v1/accounts/*/movements,/api/v1/accounts/*/transfers/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: account-transactions
                    fallbackUri: forward:/fallback
            - id: credit-transactions
              uri: lb://transaction-service
              order: 0
              predicates:
                - Path=/api/v1/credits/*/payments,/api/v1/credits/*/payments/third-party,/api/v1/credits/*/movements
              filters:
                - name: CircuitBreaker
                  args:
                    name: credit-transactions
                    fallbackUri: forward:/fallback
            - id: credit-card-transactions
              uri: lb://transaction-service
              order: 0
              predicates:
                - Path=/api/v1/credit-cards/*/charges,/api/v1/credit-cards/*/payments,/api/v1/credit-cards/*/payments/third-party,/api/v1/credit-cards/*/available-credit,/api/v1/credit-cards/*/movements
              filters:
                - name: CircuitBreaker
                  args:
                    name: credit-card-transactions
                    fallbackUri: forward:/fallback
            # Pagos con tarjeta de débito (más específico que la ruta de tarjetas de account-service).
            - id: debit-card-transactions
              uri: lb://transaction-service
              order: 0
              predicates:
                - Path=/api/v1/debit-cards/*/payments
              filters:
                - name: CircuitBreaker
                  args:
                    name: debit-card-transactions
                    fallbackUri: forward:/fallback
            # Registro e inicio de sesión (públicos).
            - id: auth
              uri: lb://auth-service
              order: 1
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: auth
                    fallbackUri: forward:/fallback
            # Monedero móvil Yanki.
            - id: yanki
              uri: lb://yanki-service
              order: 1
              predicates:
                - Path=/api/v1/yanki/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: yanki
                    fallbackUri: forward:/fallback
            # Productos y clientes.
            - id: customers
              uri: lb://customer-service
              order: 1
              predicates:
                - Path=/api/v1/customers,/api/v1/customers/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: customers
                    fallbackUri: forward:/fallback
            - id: accounts
              uri: lb://account-service
              order: 1
              predicates:
                - Path=/api/v1/accounts,/api/v1/accounts/**,/api/v1/debit-cards,/api/v1/debit-cards/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: accounts
                    fallbackUri: forward:/fallback
            - id: credits
              uri: lb://credit-service
              order: 1
              predicates:
                - Path=/api/v1/credits,/api/v1/credits/**,/api/v1/credit-cards,/api/v1/credit-cards/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: credits
                    fallbackUri: forward:/fallback

# Validación de los JWT de auth-service (RS256). Clave pública en Base64 (DER, sin encabezados PEM).
# SOLO DESARROLLO: en otro entorno se reemplaza con JWT_PUBLIC_KEY.
jwt:
  issuer: bank-auth-service
  public-key: ${JWT_PUBLIC_KEY:}
