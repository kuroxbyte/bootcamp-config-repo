server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          # Las URIs lb:// se resuelven con las instancias registradas en Eureka. Cada ruta tiene su
          # circuit breaker (timeout de 2 s en application.yaml); si falla, responde /fallback (503).
          routes:
            # Reportes del banco.
            - id: reports
              uri: lb://transaction-service
              order: 0
              predicates:
                - Path=/api/v1/reports/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: reports
                    fallbackUri: forward:/fallback
            # Transacciones anidadas bajo cada producto (más específicas, se evalúan primero).
            - id: account-transactions
              uri: lb://transaction-service
              order: 0
              predicates:
                - Path=/api/v1/accounts/*/deposits,/api/v1/accounts/*/withdrawals,/api/v1/accounts/*/balance,/api/v1/accounts/*/daily-average,/api/v1/accounts/*/movements,/api/v1/accounts/*/transfers/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: account-transactions
                    fallbackUri: forward:/fallback
            - id: credit-transactions
              uri: lb://transaction-service
              order: 0
              predicates:
                - Path=/api/v1/credits/*/payments,/api/v1/credits/*/movements
              filters:
                - name: CircuitBreaker
                  args:
                    name: credit-transactions
                    fallbackUri: forward:/fallback
            - id: credit-card-transactions
              uri: lb://transaction-service
              order: 0
              predicates:
                - Path=/api/v1/credit-cards/*/charges,/api/v1/credit-cards/*/payments,/api/v1/credit-cards/*/available-credit,/api/v1/credit-cards/*/movements
              filters:
                - name: CircuitBreaker
                  args:
                    name: credit-card-transactions
                    fallbackUri: forward:/fallback
            # Productos y clientes.
            - id: customers
              uri: lb://customer-service
              order: 1
              predicates:
                - Path=/api/v1/customers,/api/v1/customers/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: customers
                    fallbackUri: forward:/fallback
            - id: accounts
              uri: lb://account-service
              order: 1
              predicates:
                - Path=/api/v1/accounts,/api/v1/accounts/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: accounts
                    fallbackUri: forward:/fallback
            - id: credits
              uri: lb://credit-service
              order: 1
              predicates:
                - Path=/api/v1/credits,/api/v1/credits/**,/api/v1/credit-cards,/api/v1/credit-cards/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: credits
                    fallbackUri: forward:/fallback
