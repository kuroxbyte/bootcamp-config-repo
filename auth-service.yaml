server:
  port: ${SERVER_PORT:8085}

spring:
  mongodb:
    # Una base de datos por microservicio.
    uri: ${MONGODB_URI:mongodb://localhost:27021/auth_db}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: auth-service
      # Un auth-service nuevo procesa también los clientes y monederos creados antes de que
      # arrancara.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Tópicos de eventos (Kafka): consume customer-events y yanki-events.
messaging:
  topics:
    customer-events: customer-events
    yanki-events: yanki-events

# Caché de la copia local de clientes y monederos (datos maestros) en Redis.
cache:
  customers:
    ttl: ${CACHE_CUSTOMERS_TTL:10m}
  wallets:
    ttl: ${CACHE_WALLETS_TTL:10m}

# Tokens JWT firmados con RS256. Claves RSA en Base64 (DER, sin encabezados PEM).
# SOLO DESARROLLO: en otro entorno se reemplazan con JWT_PRIVATE_KEY y JWT_PUBLIC_KEY.
jwt:
  issuer: bank-auth-service
  expiration: ${JWT_EXPIRATION:1h}
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}

# Empleado del banco con rol ADMIN (POST /api/v1/auth/admin-login). Se guarda el cifrado BCrypt de
# la contraseña, nunca la contraseña.
# SOLO DESARROLLO: la contraseña de este cifrado es Admin2026!; en otro entorno se reemplazan con
# ADMIN_USERNAME y ADMIN_PASSWORD_HASH.
auth:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password-hash: ${ADMIN_PASSWORD_HASH:$2y$10$duhk6f28ZUrSW/k/rhmTjOZi3C2Fk5wRYCfkCpCJR4twS3mbGnfO2}
